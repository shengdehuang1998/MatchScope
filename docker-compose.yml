services:
  postgres:
    image: postgres:18.6
    container_name: match-insight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-match_insight}
      POSTGRES_USER: ${POSTGRES_USER:-match_insight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-match_insight_dev}
      TZ: ${APP_TIMEZONE:-Asia/Shanghai}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
